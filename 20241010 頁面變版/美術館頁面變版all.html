<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>作業示範1 PC CSS分離</title>
    <link rel="stylesheet" href="./CSS/作業all css.css">
</head>

<body>
    <div class="nav">
        <!-- 漢堡條按鈕 在此 -->
        <input type="checkbox" id="ham-menu-switch" hidden>
        <label for="ham-menu-switch" class="ham-btn">
            <div class="line line-1"></div>
            <div class="line line-2"></div>
            <div class="line line-3"></div>
        </label>
        <div class="logo"></div>
        <div class="nav-btn-all">
            <a href="https://tw.yahoo.com/" target="_blank" class="nav-btn nav-btn-1">Yahoo</a>
            <a href="https://www.google.com.tw/?hl=zh_TW" target="_blank" class="nav-btn nav-btn-2">Google</a>
            <a href="https://www.youtube.com/" target="_blank" class="nav-btn nav-btn-3">Youtube</a>
        </div>
    </div>
    <div class="container">
        <div class="content">
            <div class="img img-1"></div>
            <div class="img img-2"></div>
            <div class="img img-3"></div>
        </div>
    </div>
</body>

<!-- 1.左nav
 (上 LOGO /中 按鈕區*3 button)
2.右container
 (中 圖片區 content)
  (圖片區有三張圖image) -->
